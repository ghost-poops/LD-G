<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ASO GAMEING</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #050508;
        color: #c8ced8;
        font:
          15px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: "پێشانگای ئاسۆ";
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-family: 'Cairo', sans-serif;
        font-size: 6.5vw;
        font-weight: 900;
        color: rgba(0, 255, 204, 0.03);
        background: rgba(255, 255, 255, 0.015);
        padding: 25px 60px;
        border-radius: 25px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.03);
        white-space: nowrap;
        z-index: -1;
        pointer-events: none;
        text-shadow: 0 0 40px rgba(0, 255, 204, 0.08);
        letter-spacing: 3px;
      }

      #brand {
        text-align: left;
        padding: 15px 25px;
        background: rgba(14, 17, 22, 0.7);
        border-bottom: 1px solid #1e2732;
        backdrop-filter: blur(10px);
      }
      #brand b {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #00ffcc;
        text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
      }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #1e2732;
        border-top-color: #00ffcc;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
        display: none;
        color: #ff3333;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
        color: #00ffcc;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }
      .ok {
        color: #00ff66;
      }
      .bad {
        color: #ff3333;
      }
      .warn {
        color: #ffaa00;
      }
      .safe {
        color: #00ff66;
      }
      .danger {
        color: #ff3333;
      }
      code {
        color: #9fb3d0;
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <b>ASO GAMEING · LD GHOST</b>
    </div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
